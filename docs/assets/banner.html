<!doctype html>
<!--
  Source of the README banner (banner-light.png, banner-dark.png). Rendered at
  1280x320 with a transparent page background; see docs/assets/README.md.
  Open with ?theme=dark for the dark variant. Uses the Ubuntu Sans font that
  Ubuntu installs, so it needs no network.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screenpad-linux banner</title>
    <style>
      :root {
        /* "Night deck": the ScreenPad's black glass, a teal touch and an amber key. */
        --ink: #0e1726;
        --slate: #1e293b;
        --teal: #2dd4bf;
        --teal-deep: #0f766e;
        --amber: #fbbf24;
        --mist: #eef6f5;
        --line: #d5e6e3;
        --ink-soft: #475569;

        --bg: var(--mist);
        --border: var(--line);
        --name: var(--ink);
        --accent: var(--teal-deep);
        --text: var(--ink-soft);
        --deck: #c9d6d8;
        --deck-edge: #b4c4c7;
        --key: #e9f0f1;
        --key-edge: #a9babd;
        --glass: #0b0f17;
        --glass-edge: #2a3445;
        --glow: rgba(45, 212, 191, 0.18);
      }
      :root.dark {
        --bg: var(--ink);
        --border: var(--slate);
        --name: #ffffff;
        --accent: var(--teal);
        --text: rgba(226, 232, 240, 0.78);
        --deck: #1b2536;
        --deck-edge: #273349;
        --key: #121a28;
        --key-edge: #2c384d;
        --glass: #05080f;
        --glass-edge: #334155;
        --glow: rgba(45, 212, 191, 0.22);
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .banner {
        box-sizing: border-box;
        width: 1280px;
        height: 320px;
        border-radius: 36px;
        border: 2px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        padding: 0 0 0 76px;
        overflow: hidden;
        position: relative;
      }
      .banner::after {
        /* A thin teal-to-amber band, like the strip of keys on the panel. */
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: linear-gradient(90deg, var(--teal), var(--amber));
      }
      .words {
        flex: 1;
        font-family: "Ubuntu Sans", "Ubuntu", sans-serif;
      }
      .eyebrow {
        font-weight: 700;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }
      h1 {
        font-weight: 800;
        font-size: 84px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: var(--name);
        margin: 0 0 18px;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        font-weight: 500;
        font-size: 30px;
        line-height: 1.3;
        color: var(--text);
        margin: 0;
      }
      svg {
        flex-shrink: 0;
        width: 470px;
        height: 320px;
      }
      .deck {
        fill: var(--deck);
        stroke: var(--deck-edge);
        stroke-width: 2;
      }
      .key {
        fill: var(--key);
        stroke: var(--key-edge);
        stroke-width: 1.5;
      }
      .glass {
        fill: var(--glass);
        stroke: var(--glass-edge);
        stroke-width: 2;
      }
      .glow {
        fill: var(--glow);
      }
      .tile {
        fill: #2c2c33;
      }
      .tile-empty {
        fill: none;
        stroke: #3a3a44;
        stroke-width: 1.5;
      }
      .glyph {
        fill: none;
        stroke: #f4f4f5;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .glyph-dim {
        stroke: #8b8b95;
      }
      .clock {
        font: 300 30px "Ubuntu Sans", "Ubuntu", sans-serif;
        fill: #6b7280;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="words">
        <div class="eyebrow">ASUS ZenBook UX480FD · Ubuntu · GNOME</div>
        <h1>screenpad<span>-linux</span></h1>
        <p>First-gen ScreenPad display and touch bar</p>
      </div>
      <svg viewBox="0 0 470 320" aria-hidden="true">
        <!-- The laptop's deck, coming in from the top right edge. -->
        <rect class="deck" x="24" y="-40" width="480" height="342" rx="28" />
        <!-- Keyboard rows, cut by the banner's top edge. -->
        <g>
          <rect class="key" x="52" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="92" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="132" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="172" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="212" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="252" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="292" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="332" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="372" y="-14" width="34" height="30" rx="6" />
          <rect class="key" x="412" y="-14" width="34" height="30" rx="6" />

          <rect class="key" x="52" y="22" width="52" height="30" rx="6" />
          <rect class="key" x="110" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="150" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="190" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="230" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="270" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="310" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="350" y="22" width="34" height="30" rx="6" />
          <rect class="key" x="390" y="22" width="56" height="30" rx="6" />

          <rect class="key" x="52" y="58" width="74" height="30" rx="6" />
          <rect class="key" x="132" y="58" width="34" height="30" rx="6" />
          <rect class="key" x="172" y="58" width="154" height="30" rx="6" />
          <rect class="key" x="332" y="58" width="34" height="30" rx="6" />
          <rect class="key" x="372" y="58" width="74" height="30" rx="6" />
        </g>

        <!-- The ScreenPad: black glass with the touch bar on its top strip. -->
        <rect class="glow" x="76" y="106" width="352" height="203" rx="18" />
        <rect class="glass" x="82" y="112" width="340" height="191" rx="14" />

        <!-- The bar: push to talk (pressed, teal), mute, screenshot, Files, an empty spot, the page button, the grip. -->
        <rect x="92" y="122" width="40" height="30" rx="7" fill="#2dd4bf" />
        <path class="glyph" style="stroke: #04201c" d="M112 128.5v8 M108.5 131.5a3.5 3.5 0 0 1 7 0v5a3.5 3.5 0 0 1-7 0z M106 136a6 6 0 0 0 12 0 M112 142v4" />

        <rect class="tile" x="138" y="122" width="40" height="30" rx="7" />
        <path class="glyph glyph-dim" d="M154.5 131.5a3.5 3.5 0 0 1 7 0v5a3.5 3.5 0 0 1-7 0z M152 136a6 6 0 0 0 12 0 M158 142v4 M151 145l14-16" />

        <rect class="tile" x="184" y="122" width="40" height="30" rx="7" />
        <path class="glyph" stroke-dasharray="2 2.6" d="M196 130h14v11h-14z" />
        <path class="glyph" d="M211 141v6 M208 144h6" />

        <rect class="tile" x="236" y="122" width="40" height="30" rx="7" />
        <path d="M247 131.5a1.5 1.5 0 0 1 1.5-1.5h5l2 2h7a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5z" fill="#fbbf24" />

        <rect class="tile-empty" x="282" y="122.75" width="39.25" height="28.5" rx="7" />
        <path class="glyph glyph-dim" d="M301.5 132v10 M296.5 137h10" />

        <rect class="tile-empty" x="334" y="122.75" width="38" height="28.5" rx="7" />
        <g fill="#f4f4f5">
          <circle cx="347" cy="131" r="1.7" /><circle cx="353" cy="131" r="1.7" /><circle cx="359" cy="131" r="1.7" />
          <circle cx="347" cy="137" r="1.7" /><circle cx="353" cy="137" r="1.7" /><circle cx="359" cy="137" r="1.7" />
          <circle cx="347" cy="143" r="1.7" /><circle cx="353" cy="143" r="1.7" /><circle cx="359" cy="143" r="1.7" />
        </g>

        <rect class="tile" x="378" y="122" width="34" height="30" rx="7" />
        <path class="glyph glyph-dim" d="M389 131l6-4 6 4 M386 137h18 M389 143l6 4 6-4" />

        <!-- Below the bar: the touchpad page, black with a faint clock and battery. -->
        <text class="clock" x="252" y="238" text-anchor="middle">10:42</text>
        <g opacity="0.45">
          <rect x="236" y="250" width="28" height="13" rx="3" fill="none" stroke="#6b7280" stroke-width="1.6" />
          <rect x="264.5" y="254" width="2.5" height="5" rx="1" fill="#6b7280" />
          <rect x="239" y="253" width="17" height="7" rx="1.5" fill="#6b7280" />
        </g>
      </svg>
    </div>
    <script>
      if (new URLSearchParams(location.search).get("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
  </body>
</html>
