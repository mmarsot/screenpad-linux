# The client library for touch bar apps, and the development tooling. The
# programs themselves are Python 3 scripts using only the standard library,
# which install.sh copies; nothing here is installed with them.
#
# Built as a package, this repository is only the client library
# screenpad_app (docs/app-api.md#the-python-client-library), so an app in its
# own repository can depend on it:
#   pip install "screenpad-app @ git+https://github.com/mmarsot/screenpad-linux"
# uv never builds it (package = false below): the dev group is the tooling.
[project]
name = "screenpad-app"
version = "2.0.0"
description = "Client library for ScreenPad touch bar apps (app protocol 2), from screenpad-linux"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["screenpad_app"]

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
# Python files only; the docs keep their snippets as written.
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "RUF"]
ignore = [
    "UP031", # %-formatting is the house style
    "RUF005", # [*a, b] is not clearer than a + [b]
    "B904", # errors are turned into one-line messages on purpose
]

[tool.ruff.lint.per-file-ignores]
# The tests import the programs after putting the checkout on sys.path.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
# The tests' support modules put the checkout on sys.path, so they are
# imported before the programs' packages.
section-order = ["future", "standard-library", "third-party", "test-support", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
test-support = ["app_support", "screenpad_support", "touchbar_support"]

[tool.mypy]
python_version = "3.11"
files = [
    "screenpad.py",
    "touchbar.py",
    "screenpad_display",
    "screenpad_touchbar",
    "screenpad_app",
    "tests",
]
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# In tests a missing regex match failing the test is the point, and fakes
# record calls in plain lists; the rest is checked as in the programs.
[[tool.mypy.overrides]]
module = [
    "app_support",
    "screenpad_support",
    "test_app_client",
    "test_app_protocol",
    "test_install",
    "test_screenpad",
    "test_screenpad_grub",
    "test_screenpad_panel",
    "test_skills",
    "test_touchbar_apps",
    "test_touchbar_bar",
    "test_touchbar_cards",
    "test_touchbar_clicks",
    "test_touchbar_commands",
    "test_touchbar_config",
    "test_touchbar_decide",
    "test_touchbar_edit",
    "test_touchbar_extension",
    "test_touchbar_extension_cards",
    "test_touchbar_extension_fnkey",
    "test_touchbar_extension_keepout",
    "test_touchbar_extension_repaint",
    "test_touchbar_extension_shortcut",
    "test_touchbar_extension_widgets",
    "test_touchbar_fnkey",
    "test_touchbar_items",
    "test_touchbar_migrate",
    "test_touchbar_moves",
    "test_touchbar_notify",
    "test_touchbar_pager",
    "test_touchbar_picker",
    "test_touchbar_scene",
    "test_touchbar_surface",
    "touchbar_support",
]
disable_error_code = ["func-returns-value", "union-attr", "var-annotated"]
